server {
    listen 80;
    listen [::]:80;
    server_name genidev.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name genidev.ru;

    ssl_certificate /etc/letsencrypt/live/genidev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/genidev.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:GenidevTLS:10m;
    ssl_session_tickets off;

    root /srv/genidev/current;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
        add_header Cache-Control "no-cache";
    }
}
