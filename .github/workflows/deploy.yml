name: Deploy genidev.ru

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: genidev-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check --no-cache-dir pypdf==6.13.0

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload immutable release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          release="/srv/genidev/releases/${{ github.sha }}"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$release'"
          rsync -az --delete dist/client/ "$DEPLOY_USER@$DEPLOY_HOST:$release/"

      - name: Activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          release="/srv/genidev/releases/${{ github.sha }}"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "ln -sfn '$release' /srv/genidev/current.next && mv -Tf /srv/genidev/current.next /srv/genidev/current"
